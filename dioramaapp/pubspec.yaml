name: dioramaapp
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_bluetooth_serial: ^0.4.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  flutter_svg: ^2.0.9
  audioplayers: ^6.0.0
  google_fonts: ^6.1.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Local Android build compatibility for Gradle 9 / AGP 9; Dart API is unchanged.
dependency_overrides:
  flutter_bluetooth_serial:
    path: third_party/flutter_bluetooth_serial

flutter:
  uses-material-design: true
